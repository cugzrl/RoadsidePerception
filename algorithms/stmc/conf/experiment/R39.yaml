# @package _global_

defaults:
- override /dataset: R39
- override /encoder: precomputed
- _self_

dataset_path: ./data/R39
output_path: ./outputs

resources:
  path: ./resources
  detector: RDDETR
  reid: resnet50

tracker:
  fdim: 2048
  confidence_thresh: 0.5
  low_confidence_thresh: null
  patience: 1
  memory: 40

  matching:
    distance_threshold: 8.0
    rescale_threshold: 0.7
    reid_decay: 0.7
    rescale_weight: 0.5
  prematching:
    enabled: true
    iou_bias: 0.60
    iou_threshold: 0.50
    prune_remaining: false
  # 默认关闭 打开后失效相机不再进入 BEV 平均
  position_state:
    active_cameras_only: false
  # 默认关闭 连续帧仍走 prematch 这里只补漏检 1 到 max_gap 帧
  short_recovery:
    enabled: false
    max_gap: 3
    iou_bonus: 0.60
    match_iou: 0.50
    reject_iou: 0.30
    one_to_one: false
    one_to_one_margin: 0.08
  # 默认关闭 密集交会时清掉分不出胜负的边 低分框仍不能单独建轨迹
  link_guard:
    enabled: false
    max_gap: 3
    ambiguity_margin: 0.12
    iou_decide: 0.15
    reject_iou: 0.05
    log_path: null
  class_high_thresh: null
  # 默认关闭 中断后的在线记忆 道路筛选和 Key-Value 重关联互不绑定
  motion_memory:
    enabled: false
    retain_frames: 30
    min_missed: 4
    max_missed: 30
    fps: 20
    reid_min: 0.78
    static_reid_min: 0.88
    ambiguity_margin: 0.08
    max_speed_mps: 22
    cv_radius_base: 3.0
    cv_radius_gain: 4.0
    cv_radius_cap: 8.0
    kv_radius_base: 3.0
    kv_radius_gain: 3.0
    kv_radius_cap: 8.0
    protect_edge: 0.40
    strict_protect: false
    weight: 0.85
    use_topology: false
    use_kv: false
    kv_class_aware: false
    kv_diverse: false
    kv_blend: false
    class_reid_min: null
    kv_path: null
    lane_graph: null
    log_path: null
  knowledge:
    enabled: false
    use_spatial: true
    use_trajectory: true
    use_topology: true
    weight: 0.2
    top_k: 5
    prefix_frames: 20
    min_prefix_points: 3
    continuation_m: 8.0
    min_score: 0.45
    log_path: null

preprocess:
  nms_thresh: 0.6
  roi_filter: false
  min_box_area: 200

export_json:
  enable: true
  class_metadata_path: null
  class_match_iou: 0.3

postprocess:
  expand_boxes:
    enable: false
  remove_borders:
    enable: false
  size_filter:
    enable: false

visuals:
  plot_results: false
  plot_ground_truth: false
  store_files: false
  plot_interval: 1
